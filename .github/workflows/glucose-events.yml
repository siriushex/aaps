name: Glucose event regression

on:
  push:
    paths:
      - 'database/persistence/**'
      - '.github/workflows/glucose-events.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install compile platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-36'''
      - name: Test database events and calculation workflow
        run: >-
          ./gradlew :database:persistence:testFullDebugUnitTest
          :database:impl:testFullDebugUnitTest :workflow:testFullDebugUnitTest
          :database:persistence:lintFullDebug
          --max-workers=2 --console=plain
          -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Retain synthetic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glucose-event-test-results
          retention-days: 7
          path: |
            database/persistence/build/test-results/testFullDebugUnitTest/*.xml
            database/impl/build/test-results/testFullDebugUnitTest/*.xml
            workflow/build/test-results/testFullDebugUnitTest/*.xml
            database/persistence/build/reports/lint-results-fullDebug.html
